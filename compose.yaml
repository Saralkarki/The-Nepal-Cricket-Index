services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      DJANGO_SECURE_DEPLOYMENT: "true"
      DJANGO_DEBUG: "false"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: /srv/nepal-cricket/data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
